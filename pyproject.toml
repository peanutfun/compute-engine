[project]
name = "crace"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.1",
    "numpy>=2.3.5",
    "odc-geo>=0.4.10",
    "rioxarray>=0.19.0",
    "sparse>=0.17.0",
    "xarray>=2025.11.0",
]

[dependency-groups]
dev = [
    "hypothesis[numpy]>=6.150.0",
    "pytest>=9.0.1",
]
doc = [
    "furo>=2025.12.19",
    "sphinx>=9.0.4",
]
interactive = [
    "notebook>=7.5.0",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "W", "PL", "N"]
exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
exclude = ["scripts/*.ipynb"]
