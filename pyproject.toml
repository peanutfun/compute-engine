[project]
name = "climadace"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "anytree",
  "xarray",
  "dask[distributed]",
  "numpy",
  "rioxarray",
  "odc-geo",
  "geopandas",
  "sparse",
  "zarr",
]

[project.optional-dependencies]
dev = [
  "hypothesis[numpy]",
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "PL", "N"]
exclude = ["*.ipynb"]
